<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Local AI Chat</title>
    <style>
        body {font-family: Arial, sans-serif; margin: 0; padding: 0; display:flex; flex-direction:column;height:100vh;}
        #chat {flex:1;padding:10px;overflow-y:auto;background:#f5f5f5;}
        .msg{margin-bottom:8px;}
        .user{text-align:right;color:blue;}
        .bot{text-align:left;color:green;}
        #input-area{display:flex;border-top:1px solid #ccc;padding:10px;background:#fff;}
        #input {flex:1;padding:5px;font-size:1em;}
        #send{padding:5px 10px;margin-left:5px;font-size:1em;}
    </style>
</head>
<body>
<div id="chat"></div>
<div id="input-area">
    <textarea id="input" rows="2" placeholder="Type your message..."></textarea>
    <button id="send">Send</button>
</div>
<script src="/static/chat.js"></script>
</body>
</html>
